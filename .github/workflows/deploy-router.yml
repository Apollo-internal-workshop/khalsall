name: Deploy Router to Cloud Run

on:
  workflow_dispatch:
  workflow_call:

env:
  GEN: ${{ secrets.GEN || 'ws1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2.1.4'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Create Secret for Cloud Run
        run: gcloud secrets create ${{vars.ACTOR}}
        continue-on-error: true

      - name: Add Secret data
        run: gcloud secrets versions add --data-file=./router/router.yaml ${{vars.ACTOR}}

      # Composed locally with the connectors-mcp plugin (see readme); GraphOS can't compose mcp: yet.
      - name: Create Secret for supergraph
        run: gcloud secrets create ${{vars.ACTOR}}-supergraph
        continue-on-error: true

      - name: Add supergraph secret data
        run: gcloud secrets versions add --data-file=./supergraph.graphql ${{vars.ACTOR}}-supergraph

      - name: Look up Tickets MCP URL
        id: tickets
        run: |
          echo "url=$(gcloud run services describe ${{vars.ACTOR}}-tickets-mcp --region us-central1 --format='value(status.url)')" >> $GITHUB_OUTPUT

      # router-mcp is the router built from vendor/router (understands @connect(mcp:)). It is built
      # once (see readme) and shared; the supergraph is mounted from the secret above.
      - name: Depoy Apollo Router to Cloud Run
        run: |
          gcloud run deploy ${{vars.ACTOR}}-router --image gcr.io/summit-enterprise-workshop/router-mcp:latest \
            --set-secrets=/dist/config/router.yaml=${{vars.ACTOR}}:latest,/dist/supergraph/supergraph.graphql=${{vars.ACTOR}}-supergraph:latest \
            --set-env-vars "APOLLO_ROUTER_HOT_RELOAD=true,TICKETS_MCP_URL=${{steps.tickets.outputs.url}},APOLLO_KEY=${{ vars.TOKEN }},APOLLO_GRAPH_REF=${{vars.ACTOR}}${{env.GEN}}@current" --platform managed --region us-central1 \
            --allow-unauthenticated
