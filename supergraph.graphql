schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.6", for: EXECUTION) @link(url: "https://specs.apollo.dev/tag/v0.3") @link(url: "https://specs.apollo.dev/connect/v0.5", for: EXECUTION) @join__directive(name: "link", graphs: [ORDERS], args: {url: "https://specs.apollo.dev/connect/v0.2", import: ["@connect", "@source"]}) @join__directive(name: "link", graphs: [TICKETS], args: {url: "https://specs.apollo.dev/connect/v0.5", import: ["@connect", "@source"]}) @join__directive(name: "source", graphs: [ORDERS], args: {name: "api", http: {baseURL: "https://rest-api-j3nprurqka-uc.a.run.app/api"}}) @join__directive(name: "source", graphs: [TICKETS], args: {name: "tickets", http: {baseURL: "http://127.0.0.1:8081"}, mcp: {path: "/mcp"}}) {
  query: Query
